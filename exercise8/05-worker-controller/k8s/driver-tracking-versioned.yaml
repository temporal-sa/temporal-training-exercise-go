apiVersion: temporal.io/v1alpha1
kind: TemporalWorkerDeployment
metadata:
  name: example
  namespace: driver-tracking
  labels:
    app: driver-tracking
spec:
  replicas: 3
  workerOptions:
    connectionRef:
      name: temporal
    temporalNamespace: default
  # Start with Progressive strategy using conservative ramp percentages
  rollout:
    strategy: Progressive
    steps:
      # - rampPercentage: 1
      #   pauseDuration: 30s
      # - rampPercentage: 5
      #   pauseDuration: 30s
      # - rampPercentage: 25
      #   pauseDuration: 30s
      - rampPercentage: 50
        pauseDuration: 30s
    # gate:
    #   workflowType: TrackDriverLocation
  sunset:
    scaledownDelay: 30s
    deleteDelay: 2m
  template:
    spec:
      containers:
      - name: worker
        image: hello-world:version-a
        # image: hello-world:version-b
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
        # Note: Controller automatically adds TEMPORAL_* env vars