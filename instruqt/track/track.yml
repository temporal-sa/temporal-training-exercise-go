slug: temporal-in-practice-go
title: Temporal in Practice - Go
teaser: Seven hands-on Go exercises. Write the Workflows, Activities, Signals, Queries,
  tests and manual retries yourself.
description: |-
  A hands-on Temporal workshop in Go. Every challenge hands you a package
  full of TODOs and a Temporal dev server that is already running.

  Start with a Workflow that returns a greeting. Finish with a money
  transfer Workflow that takes a Signal for approval, answers Queries about
  its state, carries a search attribute, labels every Activity for the Web
  UI, has unit tests that skip time, and parks on bad data until a human
  sends a fix.

  The Solution tab has the finished code for every exercise. Use it when
  you get stuck, not before.
icon: ""
